# /etc/nginx/sites-available/andersen-pdf
# Nginx reverse-proxy for the Puppeteer PDF render sidecar.
# The Node.js service listens on 127.0.0.1:8001.
# This block exposes it at https://api.cpc-rfp.website/pdf/
#
# To enable:
#   sudo ln -sf /etc/nginx/sites-available/andersen-pdf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.cpc-rfp.website;

    # Redirect all HTTP → HTTPS (certbot manages this block)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.cpc-rfp.website;

    # TLS — managed by certbot
    # ssl_certificate     /etc/letsencrypt/live/api.cpc-rfp.website/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.cpc-rfp.website/privkey.pem;

    # ── PDF render sidecar (/pdf/*) ──────────────────────────────────────────
    # Strip the /pdf prefix before proxying to the Node.js service.
    # e.g. POST /pdf/render-pdf → POST /render-pdf on 127.0.0.1:8001
    location /pdf/ {
        proxy_pass         http://127.0.0.1:8001/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # PDF generation can take up to 60 seconds for large documents
        proxy_read_timeout  60s;
        proxy_send_timeout  60s;

        # Allow large HTML payloads (up to 20 MB — matches express.json limit)
        client_max_body_size 25m;
    }

    # ── Root / other paths ───────────────────────────────────────────────────
    location / {
        return 404;
    }
}
