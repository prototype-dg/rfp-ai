# llama.cpp LLM server — OpenAI-compatible API
# This block was added to /etc/nginx/sites-enabled/pdf-sidecar
# (inside the existing server {} block, alongside the existing locations)
#
# Installed: 2026-08-15
# Proxies to local llama-server on port 11434
# External endpoint: https://api.cpc-rfp.website/llm/

location /llm/ {
    proxy_pass http://127.0.0.1:11434/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_buffering off;
    proxy_cache off;
}
